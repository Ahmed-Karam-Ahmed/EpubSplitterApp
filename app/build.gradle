plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.epubsplitter'
    compileSdk 35

    defaultConfig {
        applicationId "com.local.epubsplitter"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.1.0'
}
